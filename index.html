<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman Commando</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 256x256">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrapper">
    <header id="hud">
      <div class="hud-block">
        <span class="hud-label">HP</span>
        <div class="health-bar">
          <div id="health-fill"></div>
        </div>
        <span id="health-text">100</span>
      </div>
      <div class="hud-block hud-center">
        <h1>Stickman Commando</h1>
        <span id="mode-badge" hidden></span>
      </div>
      <div class="hud-block hud-right">
        <button id="hud-autoshoot" type="button" class="toggle-btn" hidden>Auto: OFF</button>
        <span class="hud-label">Score</span>
        <span id="score">0</span>
        <span class="hud-divider">|</span>
        <span class="hud-label">Best</span>
        <span id="high-score">0</span>
      </div>
    </header>

    <canvas id="game" width="960" height="540"></canvas>
    <div id="wave-banner" class="wave-banner"></div>
    <div id="play-controls" hidden>
      <button id="speed-btn" type="button" aria-label="Game speed">1×</button>
      <button id="pause-btn" type="button" aria-label="Pause (P)">⏸</button>
      <button id="pause-keyboard-btn" type="button" class="toggle-btn" hidden aria-label="Toggle keyboard" title="Keyboard">Keys</button>
      <button id="exit-btn" type="button" aria-label="Home · back to menu" title="Home · back to menu">⌂</button>
    </div>

    <div id="overlay">
      <div id="overlay-body">
        <h2 id="overlay-title">Stickman Commando</h2>
        <p id="overlay-subtitle"></p>
        <p id="overlay-hint">↑ ↓ ← → move &nbsp;·&nbsp; SPACE shoot &nbsp;·&nbsp; mouse aim</p>
        <div id="mode-picker" hidden></div>
      </div>
      <div id="keyboard-panel" hidden aria-hidden="true">
        <div class="keyboard-toolbar">
          <button id="keyboard-scroll-left" type="button" aria-label="Scroll left one octave">‹</button>
          <span id="keyboard-range-label">C3–C5</span>
          <button id="keyboard-scroll-right" type="button" aria-label="Scroll right one octave">›</button>
        </div>
        <div id="keyboard-keys" role="group" aria-label="Synth keyboard"></div>
      </div>
      <div id="overlay-actions">
        <button id="resume-btn" type="button" class="toggle-btn" hidden>Continue</button>
        <button id="start-btn" type="button" hidden>Deploy</button>
        <button id="model-btn" type="button" class="toggle-btn" hidden>Model · Classic</button>
        <button id="autoshoot-btn" type="button" class="toggle-btn">Auto: OFF</button>
        <button id="keyboard-toggle-btn" type="button" class="toggle-btn" aria-label="Toggle keyboard" title="Keyboard">Keys</button>
      </div>
    </div>

    <div id="model-modal" class="modal" hidden aria-hidden="true">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-panel" role="dialog" aria-labelledby="model-modal-title">
        <h3 id="model-modal-title">Pick your commando</h3>
        <canvas id="model-modal-preview" width="120" height="120"></canvas>
        <div id="model-modal-grid"></div>
        <button id="model-modal-close" type="button" class="toggle-btn">Done</button>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/gore.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/xl-mode.js"></script>
  <script src="js/modes/registry.js"></script>
  <script src="js/modes/horde-survival.js"></script>
  <script src="js/modes/waves.js"></script>
  <script src="js/modes/stick-invaders.js"></script>
  <script src="js/modes/platform-raid.js"></script>
  <script src="js/modes/animated-xl.js"></script>
  <script src="js/modes/drone-drive.js"></script>
  <script src="js/modes/jet-side.js"></script>
  <script src="js/modes/stick-tetris.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
